<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trăng Đoàn Viên | Bánh Trung Thu Cao Cấp</title>
    <meta name="description" content="Khám phá bộ sưu tập bánh Trung Thu cao cấp với những hương vị tinh tuyển và hộp quà sang trọng." />
    
    <script>
      try {
        const originalFetch = window.fetch;
        let currentFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get: () => currentFetch,
          set: (newFetch) => {
            currentFetch = newFetch;
          },
          configurable: true
        });
      } catch (e) {
        console.warn('Could not polyfill window.fetch:', e);
      }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
